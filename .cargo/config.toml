# Bundled SQLCipher is compiled as a static library and statically linked
# into application test/binaries together with USearch/NumKong.
# Both SQLCipher's amalgamation and NumKong define Windows DllMain, which
# produces LNK2005/LNK1169. SQLCIPHER_OMIT_DLLMAIN is the supported
# SQLCipher flag for static linking. NumKong keeps the remaining DllMain
# (and already initializes via the MSVC .CRT$XCU constructor).
# SQLCipher encryption itself is unchanged.
[env]
LIBSQLITE3_FLAGS = "-DSQLCIPHER_OMIT_DLLMAIN"
# Debug MSVC + SQLCipher/OpenSSL + application frames overflowed 64 MiB
# test threads on GHA rustc 1.97 after catalog open succeeded (run
# 31973711228). Schema init now finishes on a 256 MiB worker; the test
# thread must match that reserve for post-open SQL and scan frames.
# This is the worker-thread stack for cargo test, not a weakened assertion.
# Windows PE main-thread reserve is set separately via RUSTFLAGS /STACK.
RUST_MIN_STACK = "268435456"
