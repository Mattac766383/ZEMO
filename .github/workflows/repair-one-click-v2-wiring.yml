name: Repair One-Click Secure Multi-Root

on:
  push:
    branches: [fix/one-click-v2-core]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-click-secure-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/one-click-v2-core
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: rustup default stable

      - name: Apply secure multi-root patch
        run: python3 scripts/fix-one-click-secure-multiroot.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck and tests
        run: npm test

      - name: Consumer organizer contract
        run: cargo test -p organizer --test one_click_v2 -- --nocapture

      - name: Metadata-only scanner contract
        run: cargo test -p application --test one_click_metadata_only -- --nocapture

      - name: Approved Apply Undo contract
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Compile secure core
        run: |
          cargo check -p persistence
          cargo check -p organizer
          cargo check -p application

      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/persistence/src/lib.rs crates/application/src/execution.rs
          git commit -m 'fix: bind one-click execution to each proposal root'
          git push origin HEAD:fix/one-click-v2-core
