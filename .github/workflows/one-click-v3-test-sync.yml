name: ZEMO One-Click v3 Test Sync

on:
  push:
    branches: [rebuild/one-click-v3]

permissions:
  contents: write

jobs:
  sync-test:
    if: ${{ !contains(github.event.head_commit.message, '[v3-test-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Update stale One-Click UI expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src/MilestoneOneClick.test.tsx')
          s = p.read_text()
          old = 'await screen.findByRole("heading", { name: "Votre ordinateur est rangé." })'
          new = 'await screen.findByRole("heading", { name: "Rangement appliqué." })'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('expected One-Click heading assertion not found')
          PY
      - name: Commit synchronized test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/MilestoneOneClick.test.tsx
          if git diff --cached --quiet; then
            echo "Test already synchronized"
            exit 0
          fi
          git commit -m "test: sync one-click v3 done heading [v3-test-synced]"
          git push origin HEAD:rebuild/one-click-v3
