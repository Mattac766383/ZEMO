name: ZEMO Open Organized Folder Patch 2

on:
  push:
    branches:
      - feat/open-organized-folder
    paths:
      - ".github/workflows/zemo-open-organized-folder-patch2.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/open-organized-folder
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Patch safe open-folder action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one anchor in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          lib = "apps/desktop/src-tauri/src/lib.rs"
          command_lines = [
              "#[tauri::command]",
              "fn open_registered_root(state: State<'_, ManagedScanner>) -> Result<(), String> {",
              "    let session = state",
              "        .service",
              "        .restore_workspace_session()",
              "        .map_err(command_error)?",
              "        .ok_or_else(|| \"Aucun dossier ZEMO n’est actuellement enregistré.\".to_owned())?;",
              "    let root = session",
              "        .root",
              "        .ok_or_else(|| \"Aucun dossier ZEMO n’est actuellement enregistré.\".to_owned())?;",
              "    let path = fs::canonicalize(&root.absolute_path)",
              "        .map_err(|_| \"Le dossier rangé n’est plus disponible à cet emplacement.\".to_owned())?;",
              "    if !path.is_dir() {",
              "        return Err(\"Le dossier rangé n’est plus disponible à cet emplacement.\".to_owned());",
              "    }",
              "",
              "    #[cfg(target_os = \"macos\")]",
              "    let result = std::process::Command::new(\"open\").arg(&path).spawn();",
              "    #[cfg(target_os = \"windows\")]",
              "    let result = std::process::Command::new(\"explorer.exe\").arg(&path).spawn();",
              "    #[cfg(all(not(target_os = \"macos\"), not(target_os = \"windows\")))]",
              "    let result = std::process::Command::new(\"xdg-open\").arg(&path).spawn();",
              "",
              "    result",
              "        .map(|_| ())",
              "        .map_err(|_| \"Impossible d’ouvrir le dossier rangé avec le gestionnaire de fichiers du système.\".to_owned())",
              "}",
              "",
              "",
          ]
          command = "\n".join(command_lines)
          replace_once(
              lib,
              '#[tauri::command(rename_all = "camelCase")]\nasync fn select_and_register_root(',
              command + '#[tauri::command(rename_all = "camelCase")]\nasync fn select_and_register_root(',
          )
          replace_once(
              lib,
              '            create_workspace,\n            select_and_register_root,',
              '            create_workspace,\n            open_registered_root,\n            select_and_register_root,',
          )

          api = "apps/desktop/src/api.ts"
          p = Path(api)
          text = p.read_text()
          if 'export async function openRegisteredRoot()' in text:
              raise SystemExit('openRegisteredRoot already exists')
          p.write_text(text.rstrip() + '\n\nexport async function openRegisteredRoot(): Promise<void> {\n  await invoke("open_registered_root");\n}\n')

          one = "apps/desktop/src/OneClickOrganize.tsx"
          replace_once(
              one,
              'export type OneClickDoneViewProps = {\n  filesMoved: number;\n  undoBusy: boolean;\n  onUndo: () => void;\n  onFinish: () => void;\n};',
              'export type OneClickDoneViewProps = {\n  filesMoved: number;\n  undoBusy: boolean;\n  openFolderBusy: boolean;\n  onUndo: () => void;\n  onOpenFolder: () => void;\n  onFinish: () => void;\n};',
          )
          replace_once(
              one,
              'export function OneClickDoneView({\n  filesMoved,\n  undoBusy,\n  onUndo,\n  onFinish,\n}: OneClickDoneViewProps) {',
              'export function OneClickDoneView({\n  filesMoved,\n  undoBusy,\n  openFolderBusy,\n  onUndo,\n  onOpenFolder,\n  onFinish,\n}: OneClickDoneViewProps) {',
          )
          replace_once(
              one,
              '        <button className="primary" type="button" onClick={onFinish}>\n          Terminé\n        </button>',
              '        <button\n          className="primary"\n          type="button"\n          disabled={openFolderBusy}\n          onClick={onOpenFolder}\n        >\n          {openFolderBusy ? "Ouverture…" : "Ouvrir le dossier rangé"}\n        </button>\n        <button type="button" onClick={onFinish}>\n          Terminé\n        </button>',
          )

          app = "apps/desktop/src/App.tsx"
          replace_once(
              app,
              '  listScanFiles,\n  listContentResults,',
              '  listScanFiles,\n  listContentResults,\n  openRegisteredRoot,',
          )
          replace_once(
              app,
              '  const [undoBusy, setUndoBusy] = useState(false);\n  const [lastOrganize, setLastOrganize] = useState(() =>',
              '  const [undoBusy, setUndoBusy] = useState(false);\n  const [openFolderBusy, setOpenFolderBusy] = useState(false);\n  const [lastOrganize, setLastOrganize] = useState(() =>',
          )
          marker = '  function clearError() {\n    setError(null);\n  }\n'
          addition = marker + '\n  async function handleOpenOrganizedFolder() {\n    clearError();\n    setOpenFolderBusy(true);\n    try {\n      await openRegisteredRoot();\n    } catch (reason) {\n      reportError(reason);\n    } finally {\n      setOpenFolderBusy(false);\n    }\n  }\n'
          replace_once(app, marker, addition)
          replace_once(
              app,
              '          filesMoved={lastOrganize?.filesMoved ?? 0}\n          undoBusy={undoBusy}\n          onUndo={() => void handleUndoOneClick()}\n          onFinish={() => setView("home")}',
              '          filesMoved={lastOrganize?.filesMoved ?? 0}\n          undoBusy={undoBusy}\n          openFolderBusy={openFolderBusy}\n          onUndo={() => void handleUndoOneClick()}\n          onOpenFolder={() => void handleOpenOrganizedFolder()}\n          onFinish={() => setView("home")}',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Frontend validation
        run: |
          npm run typecheck
          npm run test:ui -- --run

      - name: Rust formatting and desktop compile
        run: |
          cargo fmt --all -- --check
          cargo check -p desktop

      - name: Remove temporary patch workflow and commit feature
        shell: bash
        run: |
          rm .github/workflows/zemo-open-organized-folder-patch2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs apps/desktop/src/api.ts apps/desktop/src/App.tsx apps/desktop/src/OneClickOrganize.tsx .github/workflows/zemo-open-organized-folder-patch2.yml
          git commit -m "Add safe open organized folder action"
          git push origin HEAD:feat/open-organized-folder
