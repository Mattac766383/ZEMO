name: ZEMO Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zemo-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-one-click-v2:
    name: wire-one-click-v2
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/one-click-v2-core'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4
        with:
          ref: fix/one-click-v2-core
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        run: rustup default stable
      - name: Apply deterministic v2 wiring
        run: |
          python3 scripts/apply-one-click-v2-wiring.py
          python3 scripts/fix-one-click-v2-wiring-types.py
      - name: Install npm dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Rust v2 contract
        run: cargo test -p desktop --test one_click_v2_core
      - name: Rust desktop check
        run: cargo check -p desktop
      - name: Commit v2 wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/src/lib.rs apps/desktop/src/App.tsx apps/desktop/src/api.ts apps/desktop/src/types.ts apps/desktop/src/OneClickOrganize.tsx apps/desktop/src/oneClickSummary.ts Cargo.lock
          if git diff --cached --quiet; then
            echo "v2 wiring already applied"
            exit 0
          fi
          git commit -m "feat: wire one-click v2 into packaged desktop CTA"
          git push origin HEAD:fix/one-click-v2-core

  macos-core:
    name: macos-core
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install npm dependencies
        run: npm ci

      - name: Format (advisory until baseline is cleaned)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Compile core
        run: |
          cargo check -p platform-macos
          cargo check -p catalog
          cargo check -p organizer
          cargo check -p application

      - name: Clippy core (advisory until baseline is cleaned)
        continue-on-error: true
        run: |
          cargo clippy -p platform-macos -p catalog -p organizer -p application --all-targets -- -D warnings

      - name: Rust core tests
        run: |
          cargo test -p platform-macos --lib
          cargo test -p catalog --lib
          cargo test -p organizer --lib
          cargo test -p application --lib
          cargo test -p application --test one_click_metadata_only -- --nocapture

      - name: One-click native Apply Undo test
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

  windows-core:
    name: windows-core
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      LIBSQLITE3_FLAGS: -DSQLCIPHER_OMIT_DLLMAIN
      RUST_MIN_STACK: 268435456
      RUSTFLAGS: -C link-arg=/STACK:268435456
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust MSVC
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install npm dependencies
        run: npm ci

      - name: Format (advisory until baseline is cleaned)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Compile Windows core
        run: |
          cargo check -p platform-windows
          cargo check -p catalog
          cargo check -p organizer
          cargo check -p application

      - name: Platform and portable tests
        run: |
          cargo test -p platform-windows --lib
          cargo test -p catalog --lib
          cargo test -p organizer --lib
          cargo test -p application --lib
          cargo test -p application --test one_click_metadata_only -- --nocapture

      - name: One-click native Apply Undo test
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build
