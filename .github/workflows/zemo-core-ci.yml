name: ZEMO Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zemo-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-one-click-secure:
    name: verify-one-click-secure
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/one-click-v2-core'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout v2 branch
        uses: actions/checkout@v4
        with:
          ref: fix/one-click-v2-core
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: rustup default stable

      - name: Apply secure multi-root repair
        shell: bash
        run: python3 scripts/fix-one-click-secure-multiroot.py

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Deterministic consumer policy tests
        run: cargo test -p organizer --lib -- --nocapture

      - name: Metadata-only scanner contract
        run: cargo test -p application --test one_click_metadata_only -- --nocapture

      - name: Approved Apply Undo contract
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Compile secure core
        run: |
          cargo check -p persistence
          cargo check -p organizer
          cargo check -p application

      - name: Direct mutation wiring guard
        shell: bash
        run: |
          if grep -q 'apply_current_plan()' apps/desktop/src-tauri/src/lib.rs; then
            echo 'Direct filesystem One-Click apply is forbidden in the desktop Tauri boundary.' >&2
            exit 1
          fi
          if grep -q 'undo_last()' apps/desktop/src-tauri/src/lib.rs; then
            echo 'Direct filesystem One-Click undo is forbidden in the desktop Tauri boundary.' >&2
            exit 1
          fi

      - name: Commit verified multi-root repair
        shell: bash
        run: |
          if git diff --quiet -- crates/persistence/src/lib.rs crates/application/src/execution.rs; then
            echo 'Secure multi-root repair already committed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/persistence/src/lib.rs crates/application/src/execution.rs
          git commit -m 'fix: bind one-click execution to each proposal root'
          git push origin HEAD:fix/one-click-v2-core

  macos-core:
    name: macos-core
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install npm dependencies
        run: npm ci

      - name: Format (advisory until baseline is cleaned)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Compile core
        run: |
          cargo check -p platform-macos
          cargo check -p catalog
          cargo check -p organizer
          cargo check -p application

      - name: Clippy core (advisory until baseline is cleaned)
        continue-on-error: true
        run: |
          cargo clippy -p platform-macos -p catalog -p organizer -p application --all-targets -- -D warnings

      - name: Rust core tests
        run: |
          cargo test -p platform-macos --lib
          cargo test -p catalog --lib
          cargo test -p organizer --lib
          cargo test -p application --lib
          cargo test -p application --test one_click_metadata_only -- --nocapture

      - name: One-click native Apply Undo test
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

  windows-core:
    name: windows-core
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      LIBSQLITE3_FLAGS: -DSQLCIPHER_OMIT_DLLMAIN
      RUST_MIN_STACK: 268435456
      RUSTFLAGS: -C link-arg=/STACK:268435456
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust MSVC
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install npm dependencies
        run: npm ci

      - name: Format (advisory until baseline is cleaned)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Compile Windows core
        run: |
          cargo check -p platform-windows
          cargo check -p catalog
          cargo check -p organizer
          cargo check -p application

      - name: Platform and portable tests
        run: |
          cargo test -p platform-windows --lib
          cargo test -p catalog --lib
          cargo test -p organizer --lib
          cargo test -p application --lib
          cargo test -p application --test one_click_metadata_only -- --nocapture

      - name: One-click native Apply Undo test
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build
