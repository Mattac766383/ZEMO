name: ZEMO Core CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zemo-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-core:
    name: macos-core
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install npm dependencies
        run: npm ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Compile core
        run: |
          cargo check -p platform-macos
          cargo check -p catalog
          cargo check -p organizer
          cargo check -p application

      - name: Clippy core
        run: |
          cargo clippy -p platform-macos -p catalog -p organizer -p application --all-targets -- -D warnings

      - name: Rust core tests
        run: |
          cargo test -p platform-macos --lib
          cargo test -p catalog --lib
          cargo test -p organizer --lib
          cargo test -p application --lib

      - name: One-click native Apply Undo test
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

  windows-core:
    name: windows-core
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      LIBSQLITE3_FLAGS: -DSQLCIPHER_OMIT_DLLMAIN
      RUST_MIN_STACK: 268435456
      RUSTFLAGS: -C link-arg=/STACK:268435456
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust MSVC
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install npm dependencies
        run: npm ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Compile Windows core
        run: |
          cargo check -p platform-windows
          cargo check -p catalog
          cargo check -p organizer
          cargo check -p application

      - name: Platform and portable tests
        run: |
          cargo test -p platform-windows --lib
          cargo test -p catalog --lib
          cargo test -p organizer --lib
          cargo test -p application --lib

      - name: One-click native Apply Undo test
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build
