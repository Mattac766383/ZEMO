name: ZEMO Clean Auto Organize Diff

on:
  push:
    branches: [zemo/instant-auto-organize-patch-runner]

permissions:
  contents: write

jobs:
  clean-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: zemo/instant-auto-organize
          fetch-depth: 0
          persist-credentials: true

      - name: Revert rustfmt-only files outside milestone
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            apps/desktop/src-tauri/src/folder_access.rs \
            crates/application/src/scanner.rs \
            crates/application/tests/one_click_metadata_only.rs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "Keep instant auto-organize diff focused"
          git push origin HEAD:zemo/instant-auto-organize
