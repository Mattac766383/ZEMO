name: ZEMO Instant Auto Organize Patch Runner

on:
  push:
    branches: [zemo/instant-auto-organize-patch-runner]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout patch runner
        uses: actions/checkout@v4
        with:
          ref: zemo/instant-auto-organize-patch-runner
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded source patch
        run: python3 scripts/dev/apply-instant-auto-organize.py

      - name: Rust format gate
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)

      - name: Validate patch surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          test -n "$(git diff --name-only)"

      - name: Publish one clean commit to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin zemo/instant-auto-organize
          BASE_SHA="$(git rev-parse FETCH_HEAD)"
          rm -f scripts/dev/apply-instant-auto-organize.py
          rm -f .github/workflows/zemo-instant-auto-organize-patch-runner.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TREE_SHA="$(git write-tree)"
          COMMIT_SHA="$(printf '%s\n' 'Add safe instant auto-organize mode' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")"
          git push origin "$COMMIT_SHA:refs/heads/zemo/instant-auto-organize"
          echo "Published $COMMIT_SHA"
