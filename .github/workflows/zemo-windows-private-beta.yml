# ZEMO Windows private-beta: native build + qualification on a real
# GitHub-hosted Windows runner. Does not create a public release.
name: ZEMO Windows Private Beta

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "Private beta tag (example: 0.1.0-beta.7)"
        required: true
        default: "0.1.0-beta.7"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: zemo-windows-private-beta-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ZEMO_DIST_TAG: ${{ inputs.dist_tag }}
  ZEMO_WINDOWS_DIAGNOSTIC_ONLY: "0"
  LIBSQLITE3_FLAGS: "-DSQLCIPHER_OMIT_DLLMAIN"
  RUST_MIN_STACK: "268435456"
  RUSTFLAGS: "-C link-arg=/STACK:268435456"
  ZEMO_DB_INIT_TRACE: "1"

jobs:
  windows-qualification:
    name: windows-qualification
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      apply_qualified: ${{ steps.decide.outputs.apply_qualified }}
      filesystem: ${{ steps.ntfs.outputs.filesystem }}
      qualification_status: ${{ steps.decide.outputs.qualification_status }}
      diagnostic_only: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate distribution tag
        shell: pwsh
        run: |
          if ($env:ZEMO_DIST_TAG -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') {
            Write-Error "Invalid Windows private beta tag: $env:ZEMO_DIST_TAG"
            exit 2
          }
          Write-Host "Windows private beta tag: $env:ZEMO_DIST_TAG"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable MSVC
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Cache Cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: win-dev-${{ hashFiles('Cargo.toml') }}-stack64-copt1

      - name: platform-windows compile gate
        continue-on-error: true
        run: |
          cargo check -p platform-windows
          cargo check -p platform-windows --features mutation
          cargo test -p platform-windows --lib

      - name: SQLite + USearch feature tree
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path target/windows-qualification/logs | Out-Null
          cargo tree -p application -e features -i libsqlite3-sys | Tee-Object -FilePath target/windows-qualification/logs/cargo-tree-libsqlite3-sys.log
          cargo tree -p search -e features -i usearch | Tee-Object -FilePath target/windows-qualification/logs/cargo-tree-usearch.log
          cargo tree -p search -e features -i numkong | Tee-Object -FilePath target/windows-qualification/logs/cargo-tree-numkong.log
          Write-Host "LIBSQLITE3_FLAGS=$env:LIBSQLITE3_FLAGS"

      - name: Prepare Windows sidecar before desktop cargo check
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          node .\apps\desktop\scripts\prepare-operation-executor-sidecar.mjs --target x86_64-pc-windows-msvc
          node .\apps\desktop\scripts\assert-operation-executor-sidecar.mjs --target x86_64-pc-windows-msvc

      - name: Compile application / executor / desktop
        continue-on-error: true
        run: |
          cargo check -p application
          cargo check -p operation-executor
          node .\apps\desktop\scripts\assert-operation-executor-sidecar.mjs --target x86_64-pc-windows-msvc
          cargo check -p desktop
          cargo test -p application --test windows_read_only_qualification --no-run

      - name: Record runner environment
        if: always() && !cancelled()
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\print-environment.ps1
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ZEMO_CI_ENVIRONMENT_STATUS=PASS"

      - name: Install npm dependencies from lockfile
        if: always() && !cancelled()
        continue-on-error: true
        run: npm ci

      - name: NTFS qualification volume gate
        id: ntfs
        if: always() && !cancelled()
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\verify-ntfs.ps1

      - name: Windows qualification prep
        if: always() && !cancelled()
        continue-on-error: true
        run: npm run windows:qualification:prep

      - name: Frontend tests, TypeScript, production build
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          npm test
          npm run build
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ZEMO_CI_FRONTEND_STATUS=PASS"

      - name: Rust fmt, Clippy, library tests
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --exclude platform-macos --all-targets -- -D warnings
          cargo test -p operations --lib
          cargo test -p operations --features windows-apply-qualified --lib
          cargo test -p ipc-contracts --lib
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ZEMO_CI_RUST_STATUS=PASS"

      - name: Cache pinned Granite assets
        if: always() && !cancelled()
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zemo-pinned-models
          key: granite-${{ hashFiles('models/manifests/granite-embedding-97m-multilingual-r2.v1.json') }}

      - name: Download pinned Granite model
        if: always() && !cancelled()
        continue-on-error: true
        env:
          ZEMO_PINNED_MODEL_CACHE: ${{ runner.temp }}/zemo-pinned-models
        run: npm run windows:ci:download-granite

      - name: Native Windows qualification harness
        if: always() && !cancelled()
        continue-on-error: true
        run: npm run windows:qualification

      - name: Decide Apply enablement
        id: decide
        if: always() && !cancelled()
        continue-on-error: true
        run: npm run windows:ci:decide-apply

      - name: Upload qualification evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qualification-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            target/windows-qualification/windows-qualification-latest.json
            target/windows-qualification/windows-qualification-latest.txt
            target/windows-qualification/windows-diagnostic-report.txt
            target/windows-qualification/windows-diagnostic-report.json
            target/windows-qualification/qualification-summary.txt
            target/windows-qualification/apply-decision.json
            target/windows-qualification/logs

      - name: Job summary
        if: always() && !cancelled()
        run: node .\scripts\windows-ci\write-job-summary.mjs

      - name: Fail if required qualification gates did not pass
        if: always() && !cancelled()
        shell: pwsh
        run: |
          $decisionPath = "target/windows-qualification/apply-decision.json"
          if (-not (Test-Path -LiteralPath $decisionPath)) {
            Write-Error "qualification decision missing; diagnostic collection cannot unlock Apply"
            exit 1
          }
          $decision = Get-Content -LiteralPath $decisionPath -Raw | ConvertFrom-Json
          if ($decision.apply_qualified -eq $true) {
            Write-Host "Qualification decision: PASS"
            exit 0
          }
          Write-Host "Qualification decision: FAIL"
          if ($decision.blockers) {
            $decision.blockers | ForEach-Object { Write-Host " - $_" }
          }
          exit 1

  build-windows-apply-beta:
    name: build-windows-apply-beta
    needs: windows-qualification
    if: needs.windows-qualification.outputs.apply_qualified == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package script RepoRoot resolution test
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\package-windows-beta.test.ps1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable MSVC
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Cache Cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: win-dev-${{ hashFiles('Cargo.toml') }}-stack64-copt1

      - name: Record runner environment
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\print-environment.ps1
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ZEMO_CI_ENVIRONMENT_STATUS=PASS"

      - name: Prepare Windows Authenticode signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: .\scripts\windows-ci\prepare-code-signing.ps1

      - name: Install npm dependencies from lockfile
        run: npm ci

      - name: Download qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: windows-qualification-evidence
          path: target/windows-qualification

      - name: Prepare Windows sidecar before Apply build
        run: |
          node .\apps\desktop\scripts\prepare-operation-executor-sidecar.mjs --target x86_64-pc-windows-msvc
          node .\apps\desktop\scripts\assert-operation-executor-sidecar.mjs --target x86_64-pc-windows-msvc

      - name: Offer system NSIS if present
        continue-on-error: true
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            makensis /VERSION
          } else {
            Write-Host "System makensis not on PATH; Tauri 2 vendors NSIS for the bundle step."
          }

      - name: Build Apply-enabled NSIS installer
        shell: pwsh
        run: |
          if ($env:ZEMO_WINDOWS_SIGNING_ENABLED -eq "true") {
            Write-Host "Building with Tauri Authenticode signing enabled."
            npm run tauri -- build --features windows-apply-qualified --config "$env:ZEMO_TAURI_SIGNING_CONFIG"
          } else {
            Write-Host "Building unsigned private beta because certificate secrets are absent."
            npm run tauri -- build --features windows-apply-qualified
          }

      - name: Inspect packaged runtime
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\inspect-bundle.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          if ($env:ZEMO_WINDOWS_SIGNING_ENABLED -eq "true") {
            .\scripts\windows-ci\verify-authenticode.ps1 -RepoRoot $env:GITHUB_WORKSPACE -RequireSigned
          } else {
            .\scripts\windows-ci\verify-authenticode.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          }

      - name: Package private-beta files
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\package-windows-beta.ps1 -DistributionKind apply -DistTag $env:ZEMO_DIST_TAG -GitCommit $env:GITHUB_SHA -RepoRoot $env:GITHUB_WORKSPACE

      - name: Stamp signing evidence into beta metadata
        shell: pwsh
        run: .\scripts\windows-ci\stamp-signing-metadata.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Silent NSIS install smoke
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\smoke-nsis.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Upload private-beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEMO-${{ env.ZEMO_DIST_TAG }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: target/windows-qualification/dist/*

      - name: Job summary
        if: always() && !cancelled()
        run: node .\scripts\windows-ci\write-job-summary.mjs

  build-windows-propose-only:
    name: build-windows-propose-only
    needs: windows-qualification
    if: always() && needs.windows-qualification.result == 'success' && needs.windows-qualification.outputs.apply_qualified != 'true' && needs.windows-qualification.outputs.diagnostic_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable MSVC
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Cache Cargo
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          prefix-key: win-dev-${{ hashFiles('Cargo.toml') }}-stack64-copt1

      - name: Install npm dependencies from lockfile
        run: npm ci

      - name: Download qualification evidence
        uses: actions/download-artifact@v4
        with:
          name: windows-qualification-evidence
          path: target/windows-qualification

      - name: Prepare Windows sidecar before propose-only build
        run: |
          node .\apps\desktop\scripts\prepare-operation-executor-sidecar.mjs --target x86_64-pc-windows-msvc
          node .\apps\desktop\scripts\assert-operation-executor-sidecar.mjs --target x86_64-pc-windows-msvc

      - name: Offer system NSIS if present
        continue-on-error: true
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            makensis /VERSION
          } else {
            Write-Host "System makensis not on PATH; Tauri 2 vendors NSIS for the bundle step."
          }

      - name: Build propose-only NSIS installer
        run: npm run tauri -- build

      - name: Inspect packaged runtime
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\inspect-bundle.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Package propose-only files
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-ci\package-windows-beta.ps1 -DistributionKind propose-only -DistTag $env:ZEMO_DIST_TAG -GitCommit $env:GITHUB_SHA -RepoRoot $env:GITHUB_WORKSPACE

      - name: Upload propose-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEMO-${{ env.ZEMO_DIST_TAG }}-windows-x64-propose-only
          if-no-files-found: error
          retention-days: 14
          path: target/windows-qualification/dist/*

      - name: Job summary
        if: always() && !cancelled()
        run: node .\scripts\windows-ci\write-job-summary.mjs
