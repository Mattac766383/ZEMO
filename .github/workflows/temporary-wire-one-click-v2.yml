name: Temporary Wire One-Click v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: contains(github.event.head_commit.message, '[wire-v2]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-click-v2-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply v2 wiring and test migration
        run: |
          python3 scripts/apply-one-click-v2-wiring.py
          python3 scripts/fix-one-click-v2-wiring-types.py
          python3 scripts/update-one-click-v2-tests.py
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Rust v2 contract
        run: cargo test -p desktop --test one_click_v2_core
      - name: Rust desktop check
        run: cargo check -p desktop
      - name: Commit wiring to feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/src/lib.rs apps/desktop/src/App.tsx apps/desktop/src/api.ts apps/desktop/src/types.ts apps/desktop/src/OneClickOrganize.tsx apps/desktop/src/oneClickSummary.ts apps/desktop/src/MilestoneOneClick.test.tsx apps/desktop/src/Milestone12_2Ux.test.tsx Cargo.lock
          if git diff --cached --quiet; then
            echo "v2 wiring already applied"
            exit 0
          fi
          git commit -m "feat: wire and verify one-click v2 desktop flow"
          git push origin HEAD:fix/one-click-v2-core
