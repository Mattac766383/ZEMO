name: Temporary Secure Multi-Root Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[secure-multiroot]')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-click-secure-multiroot-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Rust
        run: rustup default stable
      - name: Apply secure multi-root patch
        run: python3 scripts/fix-one-click-secure-multiroot.py
      - name: Install dependencies
        run: npm ci
      - name: Verify secure source binding
        run: |
          cargo check -p persistence
          cargo check -p application
          cargo test -p application --test one_click_metadata_only -- --nocapture
          cargo test -p application --test one_click_organize -- --nocapture
      - name: Guard against direct desktop mutation wiring
        run: |
          ! grep -q 'apply_current_plan()' apps/desktop/src-tauri/src/lib.rs
          ! grep -q 'undo_last()' apps/desktop/src-tauri/src/lib.rs
      - name: Commit repaired source files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/persistence/src/lib.rs crates/application/src/execution.rs
          if git diff --cached --quiet; then
            echo 'Secure multi-root source already repaired.'
            exit 0
          fi
          git commit -m 'fix: bind one-click execution to proposal root'
          git push origin HEAD:fix/one-click-secure-multiroot-clean
