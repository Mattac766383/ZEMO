name: ZEMO macOS Private Beta

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zemo-macos-private-beta.yml"
      - "scripts/macos-ci/**"
      - "docs/macos-developer-id-notarization.md"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "Private beta tag (example: 0.1.0-beta.9)"
        required: true
        default: "0.1.0-beta.9"
        type: string

permissions:
  contents: read

concurrency:
  group: zemo-macos-private-beta-${{ github.ref }}
  cancel-in-progress: false

env:
  ZEMO_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || '0.1.0-beta.0' }}

jobs:
  macos-private-beta:
    name: macos-private-beta
    runs-on: macos-14
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Validate distribution tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ZEMO_DIST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid private beta tag: $ZEMO_DIST_TAG" >&2
            exit 2
          fi

      - name: Prepare Developer ID signing and notarization credentials
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          required=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_ISSUER_SECRET
            APPLE_API_KEY_SECRET
            APPLE_API_KEY_P8_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 3
            fi
          done

          CERT_PATH="$RUNNER_TEMP/zemo-developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_SECRET}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/zemo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "zemo-developer-id.p12").write_bytes(
              base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"])
          )
          Path(
              os.environ["RUNNER_TEMP"],
              f"AuthKey_{os.environ['APPLE_API_KEY_SECRET']}.p8",
          ).write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"]))
          PY

          chmod 600 "$CERT_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No valid Developer ID Application identity found in the supplied .p12." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 4
          fi

          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "ZEMO_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Developer ID identity prepared for release signing."

      - name: Install dependencies
        run: npm ci

      - name: Build actual ZEMO.app with packaged sidecar
        run: npm run tauri -- build --bundles app

      - name: Inspect actual app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_REL="$(find target -type d -path '*/release/bundle/macos/ZEMO.app' -print -quit)"
          test -n "$APP_REL"
          test -d "$APP_REL"
          APP="$(cd "$(dirname "$APP_REL")" && pwd -P)/$(basename "$APP_REL")"
          test -x "$APP/Contents/MacOS/operation-executor"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/operation-executor"
          echo "WORKING_NAME_PACKAGED_APP=$APP" >> "$GITHUB_ENV"

      - name: Enforce Developer ID notarization and Gatekeeper qualification
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORKING_NAME_PACKAGED_APP"
          test -d "$APP"

          SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$SIGNATURE_INFO"
          if ! grep -Fq "Authority=Developer ID Application:" <<<"$SIGNATURE_INFO"; then
            echo "ZEMO.app is not signed with a Developer ID Application certificate." >&2
            exit 5
          fi

          # Tauri submits the signed app for notarization when the App Store Connect
          # API environment variables are present. Stapling here is an independent,
          # fail-closed proof that Apple issued a notarization ticket for this bundle.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          set +e
          SPCTL_OUTPUT="$(spctl --assess --type execute -vv "$APP" 2>&1)"
          SPCTL_STATUS=$?
          set -e
          printf '%s\n' "$SPCTL_OUTPUT"
          if [[ $SPCTL_STATUS -ne 0 ]]; then
            echo "Gatekeeper rejected the packaged application." >&2
            exit 6
          fi
          if ! grep -Fq "source=Notarized Developer ID" <<<"$SPCTL_OUTPUT"; then
            echo "Gatekeeper did not report source=Notarized Developer ID." >&2
            exit 7
          fi

          echo "ZEMO_MACOS_SIGNING_MODE=Developer ID Application" >> "$GITHUB_ENV"
          echo "ZEMO_MACOS_NOTARIZED=true" >> "$GITHUB_ENV"
          echo "ZEMO_MACOS_EXTERNAL_QUALIFIED=true" >> "$GITHUB_ENV"

      - name: Run packaged sidecar authentication and physical Apply tests
        run: |
          test -d "$WORKING_NAME_PACKAGED_APP"
          cargo test -p desktop --lib packaged_macos_apply -- --ignored --nocapture --test-threads=1

      - name: Package private beta
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/macos-ci/package-macos-beta.sh
          scripts/macos-ci/package-macos-beta.sh \
            "$WORKING_NAME_PACKAGED_APP" \
            "target/macos-private-beta/dist" \
            "$ZEMO_DIST_TAG" \
            "$GITHUB_SHA"

      - name: Verify packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s target/macos-private-beta/dist/SHA256SUMS.txt
          test -s target/macos-private-beta/dist/BUILDINFO.txt
          test -s target/macos-private-beta/dist/README-FIRST.txt
          test -s target/macos-private-beta/dist/beta-manifest.json
          (cd target/macos-private-beta/dist && shasum -a 256 -c SHA256SUMS.txt)
          cat target/macos-private-beta/dist/beta-manifest.json

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node <<'NODE'
            const fs = require("fs");
            const manifest = JSON.parse(
              fs.readFileSync("target/macos-private-beta/dist/beta-manifest.json", "utf8"),
            );
            if (manifest.signing.mode !== "Developer ID Application") process.exit(10);
            if (manifest.signing.notarized !== true) process.exit(11);
            if (manifest.signing.external_user_experience_qualified !== true) process.exit(12);
            NODE
          fi

      - name: Upload private beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEMO-${{ env.ZEMO_DIST_TAG }}-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: target/macos-private-beta/dist/*

      - name: Job summary
        if: always() && !cancelled()
        shell: bash
        run: |
          echo "## ZEMO macOS private beta" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$ZEMO_DIST_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "- Signing: Developer ID Application required" >> "$GITHUB_STEP_SUMMARY"
            echo "- Notarization: Apple ticket + stapling required" >> "$GITHUB_STEP_SUMMARY"
            echo "- Gatekeeper: \`source=Notarized Developer ID\` required" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- PR validation build: external distribution qualification not attempted" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Packaged sidecar authentication + physical Apply/Undo: required before packaging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact retention: 30 days" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing keychain
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -n "${ZEMO_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$ZEMO_SIGNING_KEYCHAIN" || true
          fi
