name: Apply One-Click Root Fix

on:
  push:
    branches:
      - fix/one-click-root-scan

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-click-root-scan
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch scanner root selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/application/src/scanner.rs')
          s = p.read_text()
          old = 'let root = self.database.active_root(workspace_id)?;'
          new = '''let root = self
              .database
              .restore_current_root(workspace_id)?
              .ok_or(ApplicationError::NotFound)?;'''
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 active_root call sites, found {count}')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt --all
      - name: Focused Rust tests
        run: |
          cargo test -p application --test one_click_organize
          cargo test -p application --lib
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/application/src/scanner.rs
          git commit -m "fix: scan the explicitly selected one-click root"
          git push origin HEAD:fix/one-click-root-scan
