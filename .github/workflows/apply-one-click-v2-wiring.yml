name: One-Click v2 Core Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core-only:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/one-click-v2-core

      - name: Setup Rust
        run: rustup default stable

      - name: Verify deterministic planner core
        run: cargo test -p organizer --test one_click_v2 -- --nocapture

      - name: Verify approved executor Apply Undo path
        run: cargo test -p application --test one_click_organize -- --nocapture

      - name: Security guard
        shell: bash
        run: |
          if grep -q 'apply_current_plan()' apps/desktop/src-tauri/src/lib.rs; then
            echo 'Direct filesystem One-Click apply must not be wired into Tauri.' >&2
            exit 1
          fi
          echo 'Primary desktop Apply remains on the approved execution service.'
