name: ZEMO One-Click Unbounded Repair V2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[unbounded-v2-trigger]')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-oneclick-unbounded.py
      - run: cargo fmt --all
      - run: npm ci
      - name: Scan 5,257 files without truncation
        run: cargo test -p application --test one_click_organize consumer_scan_has_no_arbitrary_file_count_cap -- --nocapture
      - name: Physical Apply and Undo
        run: cargo test -p application --test one_click_organize one_click_consumer_proposal_moves_personal_files_and_undo_restores -- --nocapture
      - name: Frontend tests
        run: npm test --workspace apps/desktop -- --run
      - name: Production frontend build
        run: npm run build --workspace apps/desktop
      - name: Commit tested product repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/application/src/scanner.rs apps/desktop/src/App.tsx crates/application/tests/one_click_organize.rs
          git commit -m "fix: unbounded one-click scan with verified physical Apply"
          git push
