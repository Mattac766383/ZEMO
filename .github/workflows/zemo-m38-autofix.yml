name: ZEMO Milestone 38 Autofix

on:
  push:
    branches:
      - feat/search-decisions-ux-v2
    paths:
      - .github/workflows/zemo-m38-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/search-decisions-ux-v2
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply targeted Milestone 38 fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")
              print(f"updated {path}: {count} replacement(s)")

          replace_exact(
              "apps/desktop/src/SearchView.tsx",
              'result?.embeddings.productionReady === true',
              'result?.embeddings?.productionReady === true',
          )
          replace_exact(
              "apps/desktop/src/SearchView.tsx",
              'result?.interpretedQuery.length ?',
              'result?.interpretedQuery?.length ?',
          )

          for test_file in (
              "apps/desktop/src/Milestone12DesktopUx.test.tsx",
              "apps/desktop/src/Milestone12_1Dashboard.test.tsx",
              "apps/desktop/src/Milestone12_2Ux.test.tsx",
          ):
              replace_exact(
                  test_file,
                  'name: "Retrouvez vos fichiers"',
                  'name: "Décrivez simplement ce que vous cherchez"',
              )

          replace_exact(
              "apps/desktop/src/Milestone12Walkthrough.test.tsx",
              'expect(await screen.findByText("facture-point-p.pdf")).toBeTruthy();',
              'expect(await screen.findByRole("heading", { name: "facture-point-p.pdf" })).toBeTruthy();',
          )

          replace_exact(
              "apps/desktop/src/SearchDecisionsV2.test.tsx",
              'expect(screen.getByText("Factures")).toBeTruthy();',
              'expect(screen.getAllByText("Factures").length).toBeGreaterThan(0);',
          )

          replace_exact(
              "apps/desktop/src/App.test.tsx",
              '    expect(await screen.findByRole("heading", { name: "Décrivez simplement ce que vous cherchez" })).toBeTruthy();\n    expect(await screen.findByText("Invoice 2026")).toBeTruthy();',
              '    expect(await screen.findByRole("heading", { name: "Décrivez simplement ce que vous cherchez" })).toBeTruthy();\n    fireEvent.change(screen.getByRole("searchbox", { name: "Recherche" }), {\n      target: { value: "Invoice 2026" },\n    });\n    expect(await screen.findByText("Invoice 2026")).toBeTruthy();',
          )

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Validate patch shape
        run: |
          cargo fmt --all -- --check
          git diff --check
          git diff --stat

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/zemo-m38-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize frontend tests and formatting for milestone 38"
          git push origin HEAD:feat/search-decisions-ux-v2
