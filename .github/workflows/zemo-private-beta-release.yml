name: ZEMO Private Beta Release

on:
  push:
    branches: [main]
    paths:
      - "release/private-beta-request.json"
      - ".github/workflows/zemo-private-beta-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch-private-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Read release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(jq -r '.macos_dist_tag' release/private-beta-request.json)"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid macOS private beta tag: $TAG" >&2
            exit 2
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Dispatch macOS private beta from main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: gh workflow run zemo-macos-private-beta.yml --repo "$GITHUB_REPOSITORY" --ref main -f dist_tag="$TAG"

      - name: Dispatch Windows private beta from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run zemo-windows-private-beta.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Record dispatched workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
          REQUESTED_AT: ${{ steps.request.outputs.requested_at }}
        shell: bash
        run: |
          set -euo pipefail
          MAC='[]'
          WIN='[]'
          for attempt in {1..20}; do
            MAC="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-macos-private-beta.yml --event workflow_dispatch --branch main --limit 1 --json databaseId,status,conclusion,headSha,createdAt,url)"
            WIN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-windows-private-beta.yml --event workflow_dispatch --branch main --limit 1 --json databaseId,status,conclusion,headSha,createdAt,url)"
            if [ "$MAC" != "[]" ] && [ "$WIN" != "[]" ]; then
              break
            fi
            sleep 3
          done
          BODY="$(cat <<EOF
Private-beta release request dispatched from \`main\`.

Request commit: \`$GITHUB_SHA\`
Requested at: \`$REQUESTED_AT\`

macOS tag: \`$TAG\`

\`\`\`json
$MAC
\`\`\`

Windows tag: \`0.1.0-beta.6\` (current Windows workflow default)

\`\`\`json
$WIN
\`\`\`
EOF
)"
          gh issue edit 18 --repo "$GITHUB_REPOSITORY" --body "$BODY"
