name: ZEMO Private Beta Release

on:
  push:
    branches: [main]
    paths:
      - "release/private-beta-request.json"
      - ".github/workflows/zemo-private-beta-release.yml"
      - ".github/workflows/zemo-windows-private-beta.yml"
  pull_request:
    branches: [main]
    paths:
      - "release/private-beta-request.json"
      - ".github/workflows/zemo-private-beta-release.yml"
      - ".github/workflows/zemo-windows-private-beta.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  validate-private-beta-request:
    runs-on: ubuntu-latest
    outputs:
      mac_tag: ${{ steps.request.outputs.mac_tag }}
      win_tag: ${{ steps.request.outputs.win_tag }}
      requested_at: ${{ steps.request.outputs.requested_at }}
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4

      - name: Validate release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          MAC_TAG="$(jq -r '.macos_dist_tag' release/private-beta-request.json)"
          WIN_TAG="$(jq -r '.windows_dist_tag' release/private-beta-request.json)"
          TAG_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'

          if [[ ! "$MAC_TAG" =~ $TAG_PATTERN ]]; then
            echo "Invalid macOS private beta tag: $MAC_TAG" >&2
            exit 2
          fi
          if [[ ! "$WIN_TAG" =~ $TAG_PATTERN ]]; then
            echo "Invalid Windows private beta tag: $WIN_TAG" >&2
            exit 3
          fi

          echo "mac_tag=$MAC_TAG" >> "$GITHUB_OUTPUT"
          echo "win_tag=$WIN_TAG" >> "$GITHUB_OUTPUT"
          echo "requested_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          echo "Validated macOS tag: $MAC_TAG"
          echo "Validated Windows tag: $WIN_TAG"

  dispatch-private-beta:
    needs: validate-private-beta-request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch macOS private beta from main
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_TAG: ${{ needs.validate-private-beta-request.outputs.mac_tag }}
        run: gh workflow run zemo-macos-private-beta.yml --repo "$GITHUB_REPOSITORY" --ref main -f dist_tag="$MAC_TAG"

      - name: Dispatch Windows private beta from main
        env:
          GH_TOKEN: ${{ github.token }}
          WIN_TAG: ${{ needs.validate-private-beta-request.outputs.win_tag }}
        run: gh workflow run zemo-windows-private-beta.yml --repo "$GITHUB_REPOSITORY" --ref main -f dist_tag="$WIN_TAG"

      - name: Record dispatched workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_TAG: ${{ needs.validate-private-beta-request.outputs.mac_tag }}
          WIN_TAG: ${{ needs.validate-private-beta-request.outputs.win_tag }}
          REQUESTED_AT: ${{ needs.validate-private-beta-request.outputs.requested_at }}
        shell: bash
        run: |
          set -euo pipefail
          MAC='[]'
          WIN='[]'
          for attempt in {1..20}; do
            MAC="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-macos-private-beta.yml --event workflow_dispatch --branch main --limit 1 --json databaseId,status,conclusion,headSha,createdAt,url)"
            WIN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-windows-private-beta.yml --event workflow_dispatch --branch main --limit 1 --json databaseId,status,conclusion,headSha,createdAt,url)"
            if [ "$MAC" != "[]" ] && [ "$WIN" != "[]" ]; then
              break
            fi
            sleep 3
          done

          BODY="$(cat <<EOF
Private-beta release request dispatched from \`main\`.

Request commit: \`$GITHUB_SHA\`
Requested at: \`$REQUESTED_AT\`

macOS tag: \`$MAC_TAG\`

\`\`\`json
$MAC
\`\`\`

Windows tag: \`$WIN_TAG\`

\`\`\`json
$WIN
\`\`\`
EOF
)"
          gh issue edit 18 --repo "$GITHUB_REPOSITORY" --body "$BODY"
