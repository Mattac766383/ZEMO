name: Apply One-Click Runtime Diagnostics

on:
  push:
    branches:
      - diag/one-click-runtime-stage

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/one-click-runtime-stage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Surface runtime diagnostics in scan rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src/OneClickOrganize.tsx')
          s = p.read_text()
          old = '''    case "error":\n      return "Impossible à analyser";'''
          new = '''    case "error":\n      return folder.humanStatus ?? "Impossible à analyser";'''
          if s.count(old) != 1:
              raise SystemExit(f'error label anchor count={s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src/OneClickOrganize.tsx
          git commit -m "diag: show one-click native error in scan row"
          git push origin HEAD:diag/one-click-runtime-stage
