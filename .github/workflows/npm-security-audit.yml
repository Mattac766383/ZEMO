name: ZEMO NPM Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high or critical npm vulnerabilities
        run: npm audit --audit-level=high --json

      - name: Report final private beta runs
        if: startsWith(github.head_ref, 'release/private-beta-6-final-dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 0b98ea531c9f7ac9570b6b677a9ecc740e1f44f3
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$MAIN_SHA" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main moved: expected $EXPECTED_MAIN_SHA, got $MAIN_SHA" >&2
            exit 2
          fi
          MAC="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-macos-private-beta.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,status,conclusion,headSha,createdAt --jq "[.[] | select(.headSha == \"$MAIN_SHA\")]" )"
          WIN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-windows-private-beta.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,status,conclusion,headSha,createdAt --jq "[.[] | select(.headSha == \"$MAIN_SHA\")]" )"
          printf '%s\n' "FINAL PRIVATE BETA RUNS" "main: $MAIN_SHA" "tag: 0.1.0-beta.6" "" "macOS:" "$MAC" "" "Windows:" "$WIN" > /tmp/report.txt
          gh issue edit 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.txt
