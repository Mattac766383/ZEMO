name: ZEMO NPM Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate minimal npm remediation diff
        shell: bash
        run: |
          npm audit fix --package-lock-only
          echo "--- package-lock remediation diff ---"
          git diff -- package-lock.json
      - name: Verify high or critical npm vulnerabilities are gone
        shell: bash
        run: npm audit --audit-level=high --json
