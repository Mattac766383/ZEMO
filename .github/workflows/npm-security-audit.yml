name: ZEMO NPM Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high or critical npm vulnerabilities
        run: npm audit --audit-level=high --json

      - name: Report private beta runs for current main
        if: startsWith(github.head_ref, 'release/private-beta-dispatch-via-audit')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          MAC="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-macos-private-beta.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,status,conclusion,headSha,createdAt --jq "[.[] | select(.headSha == \"$MAIN_SHA\")]" )"
          WIN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-windows-private-beta.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,status,conclusion,headSha,createdAt --jq "[.[] | select(.headSha == \"$MAIN_SHA\")]" )"
          printf '%s\n' "Private-beta run inventory for main SHA: $MAIN_SHA" "" "macOS runs:" "$MAC" "" "Windows runs:" "$WIN" > /tmp/report.txt
          gh issue edit 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.txt
