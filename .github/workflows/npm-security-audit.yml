name: ZEMO NPM Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply minimal lockfile security fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only
          git diff -- package-lock.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): remediate npm audit findings"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify high or critical npm vulnerabilities are gone
        run: npm audit --audit-level=high --json
