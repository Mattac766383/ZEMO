name: ZEMO NPM Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high or critical npm vulnerabilities
        run: npm audit --audit-level=high --json

      - name: Dispatch macOS private beta from main
        if: startsWith(github.head_ref, 'release/private-beta-dispatch-via-audit')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run zemo-macos-private-beta.yml --repo "$GITHUB_REPOSITORY" --ref main -f dist_tag=0.1.0-beta.7

      - name: Dispatch Windows private beta from main
        if: startsWith(github.head_ref, 'release/private-beta-dispatch-via-audit')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run zemo-windows-private-beta.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Record dispatched beta run IDs
        if: startsWith(github.head_ref, 'release/private-beta-dispatch-via-audit')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAC_ID=""
          WIN_ID=""
          for attempt in {1..20}; do
            MAC_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-macos-private-beta.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
            WIN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zemo-windows-private-beta.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
            if [ -n "$MAC_ID" ] && [ -n "$WIN_ID" ]; then
              break
            fi
            sleep 3
          done
          REPORT="$(printf 'Private-beta workflows dispatched from main.\n\nmacOS tag: 0.1.0-beta.7\nmacOS run ID: `%s`\n\nWindows tag: 0.1.0-beta.6\nWindows run ID: `%s`\n' "$MAC_ID" "$WIN_ID")"
          gh issue edit 18 --repo "$GITHUB_REPOSITORY" --body "$REPORT"
