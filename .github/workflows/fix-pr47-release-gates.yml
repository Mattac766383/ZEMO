name: Fix PR47 Release Gates

on:
  push:
    branches: [fix/whole-user-folder-organization]
    paths:
      - scripts/fix_pr47_release_gates.py
      - .github/workflows/fix-pr47-release-gates.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/whole-user-folder-organization
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: |
          rustup default stable
          rustup component add rustfmt

      - name: Apply targeted release-gate fixes
        run: python3 scripts/fix_pr47_release_gates.py

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Verify npm audit is clean at high severity
        run: npm audit --audit-level=high

      - name: Format Rust
        run: cargo fmt --all

      - name: Verify operation executor compiles
        run: cargo check -p operation-executor

      - name: Build packaged macOS app with sidecar
        run: npm run tauri -- build --bundles app

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json workers/operation-executor/src/lib.rs
          if git diff --cached --quiet; then
            echo "No release-gate changes to commit."
            exit 0
          fi
          git commit -m "Fix PR47 release gates"
          git push origin HEAD:fix/whole-user-folder-organization
