[package]
name = "operations"
version = "0.1.0"
edition = "2024"

[features]
default = []
windows-cross-volume-audited = []
# Compile-time gate only. CI enables this after native NTFS qualification PASS.
# Do not turn this on from an arbitrary environment variable.
windows-apply-qualified = []

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.6"
chacha20poly1305 = "0.11.0"
domain = { version = "0.1.0", path = "../domain" }
getrandom = "0.4.3"
organizer = { version = "0.1.0", path = "../organizer" }
platform = { version = "0.1.0", path = "../platform" }
serde = "1.0.229"
serde_json = "1.0.151"
simulation = { version = "0.1.0", path = "../simulation" }
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["v7"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
