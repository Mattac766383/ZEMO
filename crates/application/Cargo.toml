[package]
name = "application"
version = "0.1.0"
edition = "2024"

[features]
default = []
windows-apply-qualified = ["operations/windows-apply-qualified"]

[dependencies]
ai-gateway = { version = "0.1.0", path = "../ai-gateway" }
blake3 = "1.8.6"
catalog = { version = "0.1.0", path = "../catalog" }
domain = { version = "0.1.0", path = "../domain" }
extraction = { version = "0.1.0", path = "../extraction" }
getrandom = "0.4.3"
knowledge = { version = "0.1.0", path = "../knowledge" }
ipc-contracts = { version = "0.1.0", path = "../ipc-contracts" }
operations = { version = "0.1.0", path = "../operations" }
organizer = { version = "0.1.0", path = "../organizer" }
parking_lot = "0.12.5"
persistence = { version = "0.1.0", path = "../persistence" }
platform = { version = "0.1.0", path = "../platform" }
privacy = { version = "0.1.0", path = "../privacy" }
search = { version = "0.1.0", path = "../search" }
serde = "1.0.229"
serde_json = "1.0.151"
simulation = { version = "0.1.0", path = "../simulation" }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
uuid = { version = "1.24.0", features = ["v7"] }
zeroize = "1.9.0"

[dev-dependencies]
blake3 = "1.8.6"
platform-macos = { path = "../platform-macos", features = ["mutation"] }
platform-windows = { path = "../platform-windows" }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = "3.27.0"
