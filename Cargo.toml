[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/ai-gateway",
  "crates/application",
  "crates/catalog",
  "crates/domain",
  "crates/extraction",
  "crates/ipc-contracts",
  "crates/knowledge",
  "crates/operations",
  "crates/organizer",
  "crates/persistence",
  "crates/platform",
  "crates/platform-macos",
  "crates/platform-windows",
  "crates/privacy",
  "crates/search",
  "crates/simulation",
  "workers/operation-executor",
  "workers/parser-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# SQLCipher is one amalgamation. MSVC /O2 (Rust opt-level 3) inlines that
# into giant frames: GHA rustc 1.97 overflowed a 64 MiB test stack on the
# first Database::open (STATUS_STACK_OVERFLOW). opt-level 1 keeps C frames
# finite; RUST_MIN_STACK=64MiB covers the remaining debug depth.
# Release must use the same cap or the Windows app cannot open the catalog.
# rust-cache prefix-key hashes this file so a profile change rebuilds objects.
[profile.dev.package.libsqlite3-sys]
opt-level = 1

[profile.dev.package.openssl-sys]
opt-level = 1

[profile.release.package.libsqlite3-sys]
opt-level = 1

[profile.release.package.openssl-sys]
opt-level = 1

[profile.dev.package.rusqlite]
opt-level = 1

[profile.dev.package.persistence]
opt-level = 1

[profile.dev.package.application]
opt-level = 1

[profile.test]
opt-level = 1
