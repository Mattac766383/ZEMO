[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/ai-gateway",
  "crates/application",
  "crates/catalog",
  "crates/domain",
  "crates/extraction",
  "crates/ipc-contracts",
  "crates/knowledge",
  "crates/operations",
  "crates/organizer",
  "crates/persistence",
  "crates/platform",
  "crates/platform-macos",
  "crates/platform-windows",
  "crates/privacy",
  "crates/search",
  "crates/simulation",
  "workers/operation-executor",
  "workers/parser-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# SQLCipher's amalgamation at opt-level 0/1 uses deep C frames on MSVC.
# -O3 shrinks those C frames. GHA rustc 1.97 still overflowed 2 MiB test
# threads; RUST_MIN_STACK=16MiB in .cargo/config.toml is also required.
# rust-cache prefix-key hashes this file so a profile change rebuilds C objects.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.openssl-sys]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 1
